name: Actualizar datos NFL

on:
  schedule:
    # Todos los días, 7:23 hora del centro de México (13:23 UTC)
    - cron: "23 13 * * *"
    # Domingo antes de los partidos (16:05 UTC = 10:05 CDMX): lesiones y proyecciones de último momento
    - cron: "5 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Descargar estadísticas y regenerar data.js
        run: python actualizar_datos.py
      - name: Guardar proyecciones de la semana (historial.js)
        run: node generar_historial.js
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data.js historial.js
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar datos NFL"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
