name: Diagnostico temporal
on:
  push:
    branches: [claude/project-thread-ijx0aj]
    paths: [.github/workflows/diagnostico.yml]
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar fuentes
        run: |
          echo "== preflight ESPN"
          curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://jgr0901.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: x-fantasy-filter" "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026/segments/0/leaguedefaults/3?view=kona_player_info" | grep -i -E "^HTTP|access-control"
          mkdir -p pruebas
          curl -s "https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/4241389/overview" > pruebas/overview.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=7&seasontype=2" > pruebas/scoreboard7.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=8&seasontype=2" > pruebas/scoreboard8.json
          EV=$(python3 -c "import json; print(json.load(open('pruebas/scoreboard7.json'))['events'][0]['id'])")
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$EV" > pruebas/summary.json
          python3 -c "
          import json; d=json.load(open('pruebas/overview.json')); print(list(d.keys())); n=d.get('news',[]); print(json.dumps(n[:2])[:1500]); print(json.dumps(d.get('rotowire') or d.get('fantasy') or {})[:800])
          s=json.load(open('pruebas/summary.json')); print(list(s.keys())); print(json.dumps(s.get('scoringPlays',[])[:3])[:1500])
          "
          ls -la pruebas
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add pruebas && git commit -m "Pruebas temporales de ESPN" && git push
