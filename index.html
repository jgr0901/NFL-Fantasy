<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NFL Fantasy</title>
  <meta name="theme-color" content="#094782">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NFL Fantasy">
  <link rel="icon" type="image/png" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="marca">
      <img class="logo-img" src="img/escudo.png" alt="">
      <div>
        <h1><span class="t-nfl">NFL</span> <span class="t-fan">FANTASY</span></h1>
        <p id="subtitulo" class="sub"></p><p id="subCorto" class="sub"></p>
        <div class="estado-top"><span id="sync" class="tag gris"></span> <span id="estadoEspn" class="tag gris">ESPN…</span></div>
      </div>
      <button id="btnAyuda" class="ayuda-btn" type="button" aria-label="Cómo funciona">?</button>
    </div>
    <nav id="tabs" class="tabs">
      <button data-tab="equipo" class="on"><span class="ico" aria-hidden="true">🏈</span><span class="lbl">Mi equipo</span></button>
      <button data-tab="partidos"><span class="ico" aria-hidden="true">📅</span><span class="lbl">Partidos</span></button>
      <button data-tab="jugadores"><span class="ico" aria-hidden="true">📋</span><span class="lbl">Jugadores</span></button>
      <button data-tab="trades"><span class="ico" aria-hidden="true">⚖️</span><span class="lbl">Trades</span></button>
      <button data-tab="objetivos"><span class="ico" aria-hidden="true">🔄</span><span class="lbl">Mercado</span></button>
      <button data-tab="liga"><span class="ico" aria-hidden="true">🏆</span><span class="lbl">Liga</span></button>
    </nav>
  </header>

  <main>
    <section id="tab-equipo" class="tab on"></section>
    <section id="tab-partidos" class="tab"></section>
    <section id="tab-jugadores" class="tab"></section>
    <section id="tab-trades" class="tab"></section>
    <section id="tab-objetivos" class="tab"></section>
    <section id="tab-liga" class="tab"></section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-caja">
      <button class="cerrar" id="cerrarModal" aria-label="Cerrar">×</button>
      <div id="modalCuerpo"></div>
    </div>
  </div>

  <datalist id="listaJugadores"></datalist>

  <script src="data.js"></script>
  <script src="historial.js"></script>
  <script src="espn_local.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="config_cuentas.js"></script>
  <script src="sync.js"></script>
  <script src="modelo.js"></script>
  <script src="en_linea.js"></script>
  <script src="avisos.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
  </script>
</body>
</html>
